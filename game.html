<!DOCTYPE html>
<html>
<head>
<title>Endre Rundsveen</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./js/games/permutation.js"></script>
<script src="./js/games/permutationDisplay.js"></script>


<style type="text/css">
    body {
        background-color:  #f7f7f7;
        line-height: 1.6;
        font-size: 18px;
        color: #565454;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }
    .container {
        width: 750px;
        margin: 0 auto;
        padding: 20px;
    }
    
    #permGameDisplay {
        width: 500px;
        height: 600px;
        border:#565454 2px solid;
        border-radius: 5%;
        margin:  0 auto;
    }
    #permGameCanvas {
        border:#565454 2px solid;
        border-radius: 5%;
        margin:  0 auto;
    }
    #permGameDisplay img {
        padding: 5px;
    } 
    #originalSymbols,#targetSymbols {
        width: 250px;
        margin: 0 auto;
        padding: 5px;
        text-align: center;
    }
</style>

<html>
    <div class="container">
        <h1>
            Permutation game
        </h1>

        <div id="permGame">
            <canvas width="500px" height="600px" id="permGameCanvas">

            </canvas>
            <div id="permGameDisplay">
                <div id="originalSymbols">
                    <img src="./js/games/pilhoyre.png">
                    <img src="./js/games/pilopp.png">
                    <img src="./js/games/pilvenstre.png">
                    <img src="./js/games/pilned.png">
                </div>

                <div id="targetSymbols">
                    <img src="./js/games/pilhoyre.png">
                    <img src="./js/games/pilopp.png">
                    <img src="./js/games/pilvenstre.png">
                    <img src="./js/games/pilned.png">
                </div>
            </div>
            
        </div>
    </div>
<script>
    const canvas = document.getElementById("permGameCanvas");
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingQuality = "high";
    drawFigures(ctx,125,30,[0,1,2,3],["red","green","blue","violet"]);
    drawEdge(ctx,250,100,87.5,150);
    drawEdge(ctx,250,100,250,150);
    drawEdge(ctx,250,100,337.5+75,150);
    drawNode(ctx,12.5,150,"1 2 3 4","LightGray","Black");
    drawNode(ctx,175,150,"1 2 3 4","LightGray","Black");
    drawNode(ctx,337.5,150,"1 2 3 4","LightGray","Black");
    drawEdge(ctx,87.5,200,250,250);
    drawEdge(ctx,250,200,250,250);
    drawEdge(ctx,337.5+75,200,250,250);
    
    drawEdge(ctx,250,250,87.5,300);
    drawEdge(ctx,250,250,250,300);
    drawEdge(ctx,250,250,337.5+75,300);
    drawNode(ctx,12.5,300,"1 2 3 4","LightGray","Black");
    drawNode(ctx,175,300,"1 2 3 4","LightGray","Black");
    drawNode(ctx,337.5,300,"1 2 3 4","LightGray","Black");

    drawEdge(ctx,87.5,350,250,400);
    drawEdge(ctx,250,350,250,400);
    drawEdge(ctx,337.5+75,350,250,400);

    drawFigures(ctx,125,400,[0,1,2,3],["red","green","blue","violet"]);


</script>
</html>
